<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Oaklands School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #15803d; border-bottom: 2px solid #22c55e; padding-bottom: 10px; margin-top: 30px; }
        .manage-card { background: #f3f4f6; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        form { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        input, textarea, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; border: none; }
        .btn-primary { background: #15803d; color: white; width: 100%; font-size: 1rem; }
        .btn-edit { background: #3b82f6; color: white; margin-right: 5px; }
        .btn-delete { background: #ef4444; color: white; }
        .nav-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #15803d; font-weight: bold; }
        .img-preview { max-width: 100px; max-height: 100px; border-radius: 50%; object-fit: cover; margin-top: 10px; display: none; border: 2px solid #15803d; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">← Back to Main Website</a>
        
        <h2>📬 Contact Messages</h2>
        <div id="messages-list">Loading...</div>

        <h2>🌟 Manage "Why Choose Oaklands" Features</h2>
        <div id="manage-features-list">Loading...</div>
        <h3 id="feature-form-title" style="margin-top:20px;">➕ Add New Feature</h3>
        <form id="add-feature-form">
            <input type="text" id="featureTitle" placeholder="Title (e.g., Academic Excellence)" required>
            <select id="featureIcon" required>
                <option value="fa-book-open">📖 Book (Academic)</option>
                <option value="fa-users">👥 Users (Community)</option>
                <option value="fa-palette">🎨 Palette (Arts)</option>
                <option value="fa-graduation-cap">🎓 Cap (Graduation)</option>
                <option value="fa-heart">❤️ Heart (Care)</option>
                <option value="fa-globe">🌍 Globe (Global)</option>
                <option value="fa-star">⭐ Star (General)</option>
            </select>
            <textarea id="featureDesc" placeholder="Description narrative..." required></textarea>
            <button type="submit" class="btn-primary" id="feature-btn">Add Feature</button>
        </form>
        <p id="feature-status" style="margin-top: 10px; font-weight: bold;"></p>

        <h2>👥 Manage Staff</h2>
        <div id="manage-staff-list">Loading...</div>
        <h3 id="staff-form-title" style="margin-top:20px;">➕ Add New Staff</h3>
        <form id="add-staff-form">
            <input type="text" id="staffName" placeholder="Full Name" required>
            <input type="text" id="staffRole" placeholder="Role" required>
            
            <label style="font-weight: bold; margin-top: 5px;">Upload Photo from Computer:</label>
            <input type="file" id="staffPhotoFile" accept="image/*" onchange="handleImageUpload(this)">
            <img id="photoPreview" class="img-preview" src="" alt="Preview">
            
            <textarea id="staffBio" placeholder="Biography" required></textarea>
            <button type="submit" class="btn-primary" id="staff-btn">Add Staff</button>
        </form>
        <p id="staff-status" style="margin-top: 10px; font-weight: bold;"></p>

        <h2>📰 Manage News & Announcements</h2>
        <div id="manage-news-list">Loading...</div>
        <h3 id="news-form-title" style="margin-top:20px;">➕ Post New News</h3>
        <form id="add-news-form">
            <input type="text" id="newsTitle" placeholder="Title" required>
            <select id="newsType" required><option value="Event">Event</option><option value="Announcement">Announcement</option><option value="Sports">Sports</option></select>
            <textarea id="newsDesc" placeholder="Description" required></textarea>
            <input type="url" id="newsLink" placeholder="Event Link (optional)">
            <button type="submit" class="btn-primary" id="news-btn">Post News</button>
        </form>
        <p id="news-status" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <script>
        let allFeaturesData = [], allStaffData = [], allMessagesData = [], allNewsData = [];
        let currentPhotoBase64 = ''; 

        // --- MAGIC IMAGE COMPRESSOR ---
        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Create a canvas to shrink the image
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Shrink to max 800px width/height
                        if (width > 800) { height *= 800 / width; width = 800; }
                        if (height > 800) { width *= 800 / height; height = 800; }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Compress to JPEG (0.7 quality) - makes it tiny!
                        currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        
                        const preview = document.getElementById('photoPreview');
                        preview.src = currentPhotoBase64;
                        preview.style.display = 'block';
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- MESSAGES LOGIC ---
        async function loadMessages() {
            const list = document.getElementById('messages-list');
            try {
                const res = await fetch('/contact'); const data = await res.json();
                allMessagesData = data.messages;
                if (allMessagesData.length === 0) { list.innerHTML = '<p>No messages.</p>'; return; }
                list.innerHTML = allMessagesData.map(m => `<div class="manage-card"><div><strong>${m.name}</strong> (${m.email})<br><small>${new Date(m.date).toLocaleDateString()}</small><p>${m.message}</p></div><button class="btn-delete" onclick="deleteMessage('${m._id}')">Delete</button></div>`).join('');
            } catch (e) { list.innerHTML = '<p>Error.</p>'; }
        }
        async function deleteMessage(id) { if(confirm('Delete this message?')) { await fetch(`/contact/${id}`, { method: 'DELETE' }); loadMessages(); } }

        // --- FEATURES LOGIC ---
        let currentFeatureId = null;
        async function loadManageFeatures() {
            const list = document.getElementById('manage-features-list');
            try {
                const res = await fetch('/features'); const data = await res.json();
                allFeaturesData = data.features; 
                if (allFeaturesData.length === 0) { list.innerHTML = '<p>No features yet.</p>'; return; }
                list.innerHTML = allFeaturesData.map(f => `<div class="manage-card"><div><i class="fas ${f.icon}"></i> <strong>${f.title}</strong></div><div><button class="btn-edit" onclick="editFeatureById('${f._id}')">Edit</button><button class="btn-delete" onclick="deleteFeature('${f._id}')">Delete</button></div></div>`).join('');
            } catch (e) { list.innerHTML = '<p>Error.</p>'; }
        }
        function editFeatureById(id) {
            const f = allFeaturesData.find(feat => feat._id === id); if (!f) return;
            currentFeatureId = id;
            document.getElementById('featureTitle').value = f.title; document.getElementById('featureIcon').value = f.icon; document.getElementById('featureDesc').value = f.description;
            document.getElementById('feature-form-title').innerText = '✏️ Edit Feature'; document.getElementById('feature-btn').innerText = 'Update Feature';
        }
        async function deleteFeature(id) { if(confirm('Delete this feature?')) { await fetch(`/features/${id}`, { method: 'DELETE' }); loadManageFeatures(); } }
        document.getElementById('add-feature-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('feature-status');
            const data = { title: document.getElementById('featureTitle').value, icon: document.getElementById('featureIcon').value, description: document.getElementById('featureDesc').value };
            const url = currentFeatureId ? `/features/${currentFeatureId}` : '/features';
            const res = await fetch(url, { method: currentFeatureId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res.ok) {
                status.innerText = '✅ Saved!'; status.style.color = 'green'; document.getElementById('add-feature-form').reset(); currentFeatureId = null;
                document.getElementById('feature-form-title').innerText = '➕ Add New Feature'; document.getElementById('feature-btn').innerText = 'Add Feature'; loadManageFeatures();
            } else { status.innerText = ' Error'; status.style.color = 'red'; }
        });

        // --- STAFF LOGIC ---
        let currentStaffId = null;
        async function loadManageStaff() {
            const list = document.getElementById('manage-staff-list');
            try {
                const res = await fetch('/staff'); const data = await res.json();
                allStaffData = data.staff; 
                if (allStaffData.length === 0) { list.innerHTML = '<p>No staff yet.</p>'; return; }
                list.innerHTML = allStaffData.map(s => `<div class="manage-card"><div><strong>${s.name}</strong> - ${s.role}</div><div><button class="btn-edit" onclick="editStaffById('${s._id}')">Edit</button><button class="btn-delete" onclick="deleteStaff('${s._id}')">Delete</button></div></div>`).join('');
            } catch (e) { list.innerHTML = '<p>Error.</p>'; }
        }
        function editStaffById(id) {
            const s = allStaffData.find(staff => staff._id === id); if (!s) return;
            currentStaffId = id;
            document.getElementById('staffName').value = s.name; document.getElementById('staffRole').value = s.role; document.getElementById('staffBio').value = s.bio;
            
            currentPhotoBase64 = s.photoUrl || '';
            const preview = document.getElementById('photoPreview');
            if (currentPhotoBase64) {
                preview.src = currentPhotoBase64;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            document.getElementById('staff-form-title').innerText = '✏️ Edit Staff'; document.getElementById('staff-btn').innerText = 'Update Staff';
        }
        async function deleteStaff(id) { if(confirm('Delete this staff?')) { await fetch(`/staff/${id}`, { method: 'DELETE' }); loadManageStaff(); } }
        
        document.getElementById('add-staff-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('staff-status');
            status.innerText = 'Saving... Please wait.'; status.style.color = 'blue';
            
            const data = { 
                name: document.getElementById('staffName').value, 
                role: document.getElementById('staffRole').value, 
                photoUrl: currentPhotoBase64, 
                bio: document.getElementById('staffBio').value 
            };
            const url = currentStaffId ? `/staff/${currentStaffId}` : '/staff';
            
            try {
                const res = await fetch(url, { method: currentStaffId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if (res.ok) {
                    status.innerText = '✅ Saved successfully!'; status.style.color = 'green'; 
                    document.getElementById('add-staff-form').reset(); 
                    document.getElementById('photoPreview').style.display = 'none'; 
                    currentPhotoBase64 = ''; 
                    currentStaffId = null;
                    document.getElementById('staff-form-title').innerText = '➕ Add New Staff'; document.getElementById('staff-btn').innerText = 'Add Staff'; 
                    loadManageStaff();
                } else {
                    status.innerText = ' Error saving. Check console (F12).'; status.style.color = 'red';
                }
            } catch (err) {
                status.innerText = '❌ Network Error.'; status.style.color = 'red';
                console.error(err);
            }
        });

        // --- NEWS LOGIC ---
        let currentNewsId = null;
        async function loadManageNews() {
            const list = document.getElementById('manage-news-list');
            try {
                const res = await fetch('/news'); const data = await res.json();
                allNewsData = data.news;
                if (allNewsData.length === 0) { list.innerHTML = '<p>No news yet.</p>'; return; }
                list.innerHTML = allNewsData.map(n => `<div class="manage-card"><div><span style="background:#15803d; color:white; padding:2px 8px; border-radius:10px; font-size:0.8rem; margin-right:5px;">${n.type}</span><strong>${n.title}</strong> <small style="color:#666;">(${new Date(n.date).toLocaleDateString()})</small></div><div><button class="btn-edit" onclick="editNewsById('${n._id}')">Edit</button><button class="btn-delete" onclick="deleteNews('${n._id}')">Delete</button></div></div>`).join('');
            } catch (e) { list.innerHTML = '<p>Error.</p>'; }
        }
        function editNewsById(id) {
            const n = allNewsData.find(news => news._id === id); if (!n) return;
            currentNewsId = id;
            document.getElementById('newsTitle').value = n.title; document.getElementById('newsType').value = n.type; document.getElementById('newsDesc').value = n.description;
            document.getElementById('newsLink').value = n.eventUrl || '';
            document.getElementById('news-form-title').innerText = '✏️ Edit News/Announcement'; document.getElementById('news-btn').innerText = 'Update News';
        }
        async function deleteNews(id) { if(confirm('Delete this news post?')) { await fetch(`/news/${id}`, { method: 'DELETE' }); loadManageNews(); } }
        document.getElementById('add-news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('news-status');
            const data = { title: document.getElementById('newsTitle').value, type: document.getElementById('newsType').value, description: document.getElementById('newsDesc').value, eventUrl: document.getElementById('newsLink').value };
            const url = currentNewsId ? `/news/${currentNewsId}` : '/news';
            const res = await fetch(url, { method: currentNewsId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res.ok) {
                status.innerText = '✅ Saved!'; status.style.color = 'green'; document.getElementById('add-news-form').reset(); currentNewsId = null;
                document.getElementById('news-form-title').innerText = '➕ Post New News'; document.getElementById('news-btn').innerText = 'Post News'; loadManageNews();
            } else { status.innerText = '❌ Error'; status.style.color = 'red'; }
        });

        // Init
        loadMessages(); loadManageFeatures(); loadManageStaff(); loadManageNews();
    </script>
</body>
</html>
