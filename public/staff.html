<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Staff - Oaklands Nursery and Primary School</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific style for the page header */
        .page-header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 40px;
        }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .page-header p { font-size: 1.1rem; opacity: 0.9; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <img src="/logo.png" alt="Oaklands School Logo" class="site-logo">
                <div class="logo-text">
                    <span class="logo-title">Oaklands</span>
                    <span class="logo-subtitle">Nursery & Primary School</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#news">News</a></li>
                <!-- Highlighted Staff Link -->
                <li><a href="/staff.html" style="color: var(--primary-color); font-weight: bold;">Staff</a></li>
                <li><a href="/#contact" class="btn-nav">Contact Us</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1>Meet Our Dedicated Staff</h1>
            <p>The passionate educators and leaders guiding our students every day.</p>
        </div>
    </header>

    <!-- Staff Directory Section -->
    <section class="section-padding bg-light">
        <div class="container">
            <div id="staff-list" class="staff-grid">
                <p class="loading-text">Loading staff members...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Oaklands Nursery and Primary School. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
