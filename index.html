<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oaklands Nursery and Primary School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <h1>Oaklands Nursery & Primary School</h1>
            <nav>
                <a href="#home">Home</a>
                <a href="#staff">Our Staff</a>
                <a href="#contact">Contact Us</a>
            </nav>
        </div>
    </header>
    <!-- News & Events Section -->
    <section id="news" class="container">
        <h2>News & Events</h2>
        <div id="news-list" class="news-grid">
            <p>Loading news...</p>
        </div>
    </section>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <h2>Welcome to Oaklands</h2>
            <p>Nurturing young minds for a brighter future.</p>
        </div>
    </section>

    <!-- Staff Directory Section -->
    <section id="staff" class="container">
        <h2>Meet Our Staff</h2>
        <div id="staff-list" class="staff-grid">
            <p>Loading staff members...</p>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section id="contact" class="container contact-section">
        <h2>Contact Us</h2>
        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
        <p id="form-status"></p>
    </section>

    <footer>
        <p>&copy; 2026 Oaklands Nursery and Primary School</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
